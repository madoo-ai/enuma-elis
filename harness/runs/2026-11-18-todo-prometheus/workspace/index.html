<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2430;
    --muted: #6b7280;
    --line: #e3e7ee;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d;
      --card: #1a202a;
      --text: #e6eaf2;
      --muted: #9aa4b2;
      --line: #2a3340;
      --accent: #6f9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: .65rem .8rem;
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--card);
    color: inherit;
    font: inherit;
  }
  input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: .65rem 1rem;
    border: 1px solid transparent;
    border-radius: .5rem;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .7rem .85rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .5rem;
  }
  li + li { margin-top: .5rem; }
  li label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: .75rem;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  li input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  li.done label span { color: var(--muted); text-decoration: line-through; }
  .delete {
    background: transparent;
    border-color: var(--line);
    color: var(--muted);
    padding: .3rem .6rem;
    font-weight: 500;
  }
  .delete:hover { color: var(--text); border-color: var(--muted); }
  .empty { color: var(--muted); padding: .5rem 0; }
  .empty[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>To-do</h1>
  <form id="add-form">
    <input id="new-todo" type="text" placeholder="What needs doing?" autocomplete="off" aria-label="New to-do">
    <button id="add-button" type="submit" disabled>Add</button>
  </form>
  <p id="empty" class="empty">Nothing yet. Add your first to-do above.</p>
  <ul id="list"></ul>
</main>
<script>
(() => {
  const STORAGE_KEY = 'todos';
  const form = document.getElementById('add-form');
  const input = document.getElementById('new-todo');
  const addButton = document.getElementById('add-button');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  const newId = () =>
    (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));

  function load() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  let todos = load();

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    list.replaceChildren();
    for (const todo of todos) {
      const item = document.createElement('li');
      item.classList.toggle('done', todo.done);

      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.dataset.id = todo.id;
      checkbox.setAttribute('aria-label', 'Complete "' + todo.text + '"');
      checkbox.addEventListener('change', () => toggle(todo.id));

      const text = document.createElement('span');
      text.textContent = todo.text;
      label.append(checkbox, text);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete';
      remove.dataset.id = todo.id;
      remove.textContent = 'Delete';
      remove.setAttribute('aria-label', 'Delete "' + todo.text + '"');
      remove.addEventListener('click', () => removeTodo(todo.id));

      item.append(label, remove);
      list.append(item);
    }
    empty.hidden = todos.length > 0;
  }

  function add(text) {
    todos.push({ id: newId(), text, done: false });
    save();
    render();
  }

  function toggle(id) {
    const todo = todos.find((t) => t.id === id);
    if (!todo) return;
    todo.done = !todo.done;
    save();
    render();
  }

  function removeTodo(id) {
    todos = todos.filter((t) => t.id !== id);
    save();
    render();
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    add(text);
    input.value = '';
    addButton.disabled = true;
    input.focus();
  });

  input.addEventListener('input', () => {
    addButton.disabled = input.value.trim() === '';
  });

  render();
})();
</script>
</body>
</html>
