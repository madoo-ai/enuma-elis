<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --surface: #fff;
    --text: #1d1c1a;
    --muted: #6f6a63;
    --border: #dcd8d0;
    --accent: #2f6f4f;
    --danger: #a3352a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #211f1c;
      --text: #ece8e1;
      --muted: #a29b90;
      --border: #37332e;
      --accent: #7fc49b;
      --danger: #e08b7f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 4rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app { width: min(100%, 34rem); }
  h1 { margin: 0 0 1.25rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
  form { display: flex; gap: .5rem; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: .65rem .8rem;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .5rem;
  }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }
  button { font: inherit; cursor: pointer; border: 1px solid transparent; border-radius: .5rem; }
  form button {
    padding: .65rem 1.1rem;
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }
  ul { display: grid; gap: .5rem; list-style: none; margin: 1.25rem 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .65rem .8rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .5rem;
  }
  li label { flex: 1; display: flex; align-items: center; gap: .75rem; min-width: 0; cursor: pointer; }
  li input[type="checkbox"] { flex: none; width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  li span { overflow-wrap: anywhere; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  .delete {
    flex: none;
    width: 2rem;
    height: 2rem;
    background: none;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
  }
  .delete:hover, .delete:focus-visible { color: var(--danger); }
  .empty, .status { margin: 1rem 0 0; color: var(--muted); font-size: .875rem; }
  .status { display: flex; justify-content: space-between; gap: 1rem; }
  .status [hidden] { display: none; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<main class="app">
  <h1>To-do</h1>
  <form id="new-todo" autocomplete="off">
    <label class="sr-only" for="new-todo-text">New task</label>
    <input id="new-todo-text" type="text" maxlength="200" placeholder="What needs doing?" required>
    <button type="submit">Add</button>
  </form>
  <ul id="todo-list" aria-label="Tasks"></ul>
  <p id="empty" class="empty" hidden>No tasks yet.</p>
  <p class="status">
    <span id="count" aria-live="polite"></span>
    <span id="storage-warning" hidden>Not saved — storage unavailable</span>
  </p>
</main>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todos.v1";

  var form = document.getElementById("new-todo");
  var input = document.getElementById("new-todo-text");
  var list = document.getElementById("todo-list");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");
  var warning = document.getElementById("storage-warning");

  var todos = load();

  function load() {
    var raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return [];
    }
    if (!raw) return [];
    try {
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (item) {
          return item && typeof item.text === "string";
        })
        .map(function (item) {
          return { id: String(item.id), text: item.text, done: Boolean(item.done) };
        });
    } catch (err) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      warning.hidden = true;
    } catch (err) {
      warning.hidden = false;
    }
  }

  function newId() {
    if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function find(id) {
    return todos.find(function (todo) {
      return todo.id === id;
    });
  }

  function itemElement(todo) {
    var item = document.createElement("li");
    item.dataset.id = todo.id;
    item.className = todo.done ? "done" : "";

    var label = document.createElement("label");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = todo.done;
    var text = document.createElement("span");
    // textContent, not innerHTML: task text is user input and must never be parsed as markup.
    text.textContent = todo.text;
    label.append(box, text);

    var remove = document.createElement("button");
    remove.type = "button";
    remove.className = "delete";
    remove.textContent = "\u00d7";
    remove.title = "Delete";
    remove.setAttribute("aria-label", "Delete " + todo.text);

    item.append(label, remove);
    return item;
  }

  function render() {
    list.replaceChildren.apply(list, todos.map(itemElement));
    empty.hidden = todos.length > 0;
    var done = todos.filter(function (todo) {
      return todo.done;
    }).length;
    count.textContent = todos.length ? done + " of " + todos.length + " done" : "";
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    todos.push({ id: newId(), text: text, done: false });
    input.value = "";
    input.focus();
    render();
    save();
  });

  list.addEventListener("change", function (event) {
    if (event.target.type !== "checkbox") return;
    var todo = find(event.target.closest("li").dataset.id);
    if (!todo) return;
    todo.done = event.target.checked;
    render();
    save();
  });

  list.addEventListener("click", function (event) {
    var button = event.target.closest("button.delete");
    if (!button) return;
    var id = button.closest("li").dataset.id;
    todos = todos.filter(function (todo) {
      return todo.id !== id;
    });
    render();
    save();
  });

  // Another tab changed the same key: mirror its state so the next edit here doesn't clobber it.
  window.addEventListener("storage", function (event) {
    if (event.key !== STORAGE_KEY) return;
    todos = load();
    render();
  });

  render();
})();
</script>
</body>
</html>
